name: CI (Pull Request Validation)

on:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------
  # Job 1 : Qualité du code et tests unitaires
  # -------------------------------------------------------------
  code-quality:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Installe uv et gère le cache global d'Astral
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "uv-cache"

      # Installe la version de Python requise via uv
      - name: Set up Python
        run: uv python install 3.12

      # Installation instantanée des dépendances via uv sync
      - name: Install dependencies
        run: |
          uv sync --frozen

      # Linter & Typecheck Python (Ruff / Basedpyright / Mypy)
      - name: Run Python linting & checks
        run: |
          uv run ruff check . --fix
          uv run ruff format .
          # uv run mypy .

      # Tests unitaires
      - name: Run unit tests
        run: |
          uv run pytest -v

  # -------------------------------------------------------------
  # Job 2 : Synthèse CDK
  # -------------------------------------------------------------
  cdk-validation:
    name: CDK Synth Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          uv sync --frozen

      # CDK utilise le virtualenv généré automatiquement par uv (.venv)
      - name: CDK Synth
        run: |
          source .venv/bin/activate
          npx cdk synth